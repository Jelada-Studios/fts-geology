<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 120" width="132" height="120" role="img" aria-label="FT's Geology">
  <title>FT's Geology</title>
  <!--
    FT, faulted. A fracture runs between the letters and the far block has dropped, so the T sits
    lower than the F. The trace bends part way down, because a fault plane is not a ruled line and
    a straight one reads as a slash. Monochrome, so it inherits the site's .invert treatment like
    the studio mark.
  -->

  <!-- F, on the upthrown block -->
  <path d="M10 14 H56 V32 H28 V48 H48 V66 H28 V98 H10 Z"/>

  <!-- The fault trace, kept to a hairline so it never reads as a letter stroke -->
  <path d="M62.5 0 L66 0 L60 60 L50 120 L46.5 120 L56.5 60 Z"/>

  <!-- T, on the downthrown block: the same letter height, dropped 14 -->
  <path d="M70 28 H122 V46 H105 V112 H87 V46 H70 Z"/>
</svg>
