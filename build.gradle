plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.11.0'
group = 'com.jeladastudios.ftsgeology'

base {
    archivesName = 'fts-geology-1.21.1-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.251'

    // META-INF/accesstransformer.cfg opens vanilla's surface rule context and the noise generator's column walk.
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'neoforge.logging.console.level', 'debug'
        }
    }

    mods {
        fts_geology {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

// The port goes a package at a time (docs/NEOFORGE_PORT_KURALLARI.md, section 13). A package not ported yet is left
// out of the build here; the line comes out when it is ported.
def notYetPorted = [
        'GeysersMod.java',
        'advancement', 'api', 'block', 'blockentity', 'client', 'command', 'compat', 'config', 'eruption', 'fluid',
        'gas', 'hydrology', 'instrument', 'item', 'mixin', 'network', 'quake', 'registry', 'volcano', 'weather',
        'worldgen',
]
sourceSets.main.java {
    notYetPorted.each { p -> exclude p.endsWith('.java') ? "com/jeladastudios/ftsgeology/${p}" : "com/jeladastudios/ftsgeology/${p}/**" }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'fts_geology',
            'Specification-Vendor'    : 'Jelada Studios',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Jelada Studios',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'fts_geology.mixins.json'
        ])
    }
}
