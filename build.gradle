plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.9.10-alpha'
group = 'com.jeladastudios.ftsgeology'
archivesBaseName = 'fts-geology'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // No access transformers needed — we only touch public API.
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : 'FT\'s Geology',
            'Specification-Vendor'  : 'Jelada Studios',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version
        ])
    }
}

// Gradle names the jar after the version, so every version bump leaves the old
// one behind in build/libs. Sweep them so the folder always holds exactly the
// build that just ran — copying a stale jar into the mods folder is too easy.
tasks.named('jar') {
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
}
