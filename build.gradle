buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.11.0'
group = 'com.jeladastudios.ftsgeology'
archivesBaseName = 'fts-geology'

apply plugin: 'org.spongepowered.mixin'

// One mixin: a data pack's own overworld no longer replaces the mod's chosen world type (worldgen.terrain.KeepOverworld).
mixin {
    add sourceSets.main, 'fts_geology.refmap.json'
    config 'fts_geology.mixins.json'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // Opens vanilla's surface rule context to the lithology rule; see the file for exactly what.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : 'FT\'s Geology',
            'Specification-Vendor'  : 'Jelada Studios',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'fts_geology.mixins.json'
        ])
    }
}

// Gradle names the jar after the version, so every version bump leaves the old
// one behind in build/libs. Sweep them so the folder always holds exactly the
// build that just ran — copying a stale jar into the mods folder is too easy.
tasks.named('jar') {
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
}
