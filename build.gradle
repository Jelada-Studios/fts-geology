buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.11.0'
group = 'com.jeladastudios.ftsgeology'
archivesBaseName = 'fts-geology'

apply plugin: 'org.spongepowered.mixin'

// One mixin: a data pack's own overworld no longer replaces the mod's chosen world type (worldgen.terrain.KeepOverworld).
mixin {
    add sourceSets.main, 'fts_geology.refmap.json'
    config 'fts_geology.mixins.json'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // Opens vanilla's surface rule context to the lithology rule; see the file for exactly what.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { geysers { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    // Distant Horizons' API, for the optional far-terrain generator: compiled against, never shipped.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Create and the libraries it bundles, copied into libs/ from a Create jar, for the gas engine's crankshaft.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // The API of the Distant Horizons the mod is tested with (3.3.2); a copy in libs/ is used when there is one.
    def dhApi = file('libs/DistantHorizonsApi-7.2.0.jar')
    compileOnly dhApi.exists() ? files(dhApi) : 'maven.modrinth:DistantHorizonsApi:7.2.0'
    // Embeddium, for the river's flow in its fluid renderer (a mixin, applied only when it is there): compiled against,
    // never shipped.
    def embeddium = file('libs/embeddium-0.3.31+mc1.20.1.jar')
    compileOnly embeddium.exists() ? files(embeddium) : 'maven.modrinth:embeddium:0.3.31+mc1.20.1'
    // Create (MIT), for the gas engine's crankshaft (compat.create, built only when Create's jar is in libs/, its
    // Flywheel, Ponder and Registrate beside it out of its META-INF/jarjar): compiled against, never shipped.
    if (file('libs/create-1.20.1-6.0.8.jar').exists()) {
        ['create-1.20.1:6.0.8', 'flywheel-forge-1.20.1:1.0.5', 'Ponder-Forge-1.20.1:1.0.91', 'Registrate-MC1.20:1.3.3']
                .each { compileOnly fg.deobf("blank:${it}") }
    } else {
        sourceSets.main.java.exclude 'com/jeladastudios/ftsgeology/compat/create/**'
    }
}

tasks.named('jar') {
    // The licence goes with the jar, as the GPL asks of whoever passes the mod on.
    from('LICENSE') { rename { 'LICENSE_fts_geology' } }
    manifest {
        attributes([
            'Specification-Title'   : 'FT\'s Geology',
            'Specification-Vendor'  : 'Jelada Studios',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'fts_geology.mixins.json'
        ])
    }
}

// Gradle names the jar after the version, so every version bump leaves the old
// one behind in build/libs. Sweep them so the folder always holds exactly the
// build that just ran — copying a stale jar into the mods folder is too easy.
tasks.named('jar') {
    doFirst {
        delete fileTree(layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
}
