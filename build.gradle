plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.11.0'
group = 'com.jeladastudios.ftsgeology'

base {
    archivesName = 'fts-geology-1.21.1-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.251'

    // META-INF/accesstransformer.cfg opens vanilla's surface rule context and the noise generator's column walk.
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.console.level', 'debug'
            // Test runs: a marker to find the process by, a folder of its own.
            systemProperty 'ftstest', '74de3639'
            gameDirectory = project.file('run/client')
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
        }
        server {
            server()
            systemProperty 'neoforge.logging.console.level', 'debug'
            // Test runs: a marker to find the process by, a folder of its own, no window.
            systemProperty 'ftstest', '74de3639'
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        fts_geology {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Distant Horizons' API, for the optional far-terrain generator: platform-independent, compiled against, never shipped.
    compileOnly files('libs/DistantHorizonsApi-7.2.0.jar')
    // Create (MIT), for the gas engine's crankshaft (compat.create, built only when Create's jar is in libs/, its
    // Flywheel, Ponder and Registrate beside it out of its META-INF/jarjar): compiled against, never shipped.
    if (file('libs/create-1.21.1-6.0.10.jar').exists()) {
        compileOnly files('libs/create-1.21.1-6.0.10.jar', 'libs/flywheel-neoforge-1.21.1-1.0.6.jar',
                'libs/ponder-neoforge-1.0.82+mc1.21.1.jar', 'libs/Registrate-MC1.21-1.3.0+67.jar')
    } else {
        sourceSets.main.java.exclude 'com/jeladastudios/ftsgeology/compat/create/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.named('jar', Jar).configure {
    // The licence goes with the jar, as the GPL asks of whoever passes the mod on.
    from('LICENSE') { rename { 'LICENSE_fts_geology' } }
    manifest {
        attributes([
            'Specification-Title'     : 'fts_geology',
            'Specification-Vendor'    : 'Jelada Studios',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Jelada Studios',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'fts_geology.mixins.json'
        ])
    }
}

// Test runs carry their marker on the java command line itself, where a process list shows it.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    systemProperty 'ftstest', '74de3639'
}
