plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.11.0'
group = 'com.jeladastudios.ftsgeology'

base {
    archivesName = 'fts-geology-1.21.1-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.251'

    // META-INF/accesstransformer.cfg opens vanilla's surface rule context and the noise generator's column walk.
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.console.level', 'debug'
            // Test runs: a marker to find the process by, a folder of its own.
            systemProperty 'ftstest', '74de3639'
            gameDirectory = project.file('run/client')
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
        }
        server {
            server()
            systemProperty 'neoforge.logging.console.level', 'debug'
            // Test runs: a marker to find the process by, a folder of its own, no window.
            systemProperty 'ftstest', '74de3639'
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        fts_geology {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Distant Horizons' API, for the optional far-terrain generator: platform-independent, compiled against, never shipped.
    compileOnly files('libs/DistantHorizonsApi-7.2.0.jar')
}

// The port goes a package at a time (docs/NEOFORGE_PORT_KURALLARI.md, section 13). A package not ported yet is left
// out of the build here; the line comes out when it is ported.
def notYetPorted = [
        // Create 6 for NeoForge 1.21.1 is not on this machine yet: the crankshaft waits for its jar.
        'compat/create',
        // Sodium 0.6 for NeoForge 1.21.1 (Embeddium's successor) is not on this machine: the river flow in its renderer waits.
        'mixin/EmbeddiumRiverFlowMixin.java',
]
sourceSets.main.java {
    notYetPorted.each { p -> exclude p.endsWith('.java') ? "com/jeladastudios/ftsgeology/${p}" : "com/jeladastudios/ftsgeology/${p}/**" }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'fts_geology',
            'Specification-Vendor'    : 'Jelada Studios',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Jelada Studios',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'fts_geology.mixins.json'
        ])
    }
}

// Test runs carry their marker on the java command line itself, where a process list shows it.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    systemProperty 'ftstest', '74de3639'
}
