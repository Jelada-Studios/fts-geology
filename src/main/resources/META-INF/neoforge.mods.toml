modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"
issueTrackerURL = "https://github.com/Jelada-Studios/fts-geology/issues"

[[mixins]]
config = "fts_geology.mixins.json"

[[mods]]
modId = "fts_geology"
version = "0.11.3"
displayName = "FT's Geology"
authors = "Jelada Studios"
credits = "See CREDITS.md — community reports and questions that shaped the mod."
displayURL = "https://jeladastudios.com/fts-geology/"
updateJSONURL = "https://raw.githubusercontent.com/Jelada-Studios/fts-geology/main/update.json"
description = '''
The Minecraft world built from plate tectonics. Plates drift, and their edges become mountain belts,
volcanic arcs, rifts and ocean ridges.

- A 960-block tall world type, with mountains from real elevation data and one Everest, K2 and Matterhorn
- Earthquakes from the faults: P and S waves, aftershocks, liquefaction and landslides. Damage depends
  on what a build is made of and what it stands on.
- Volcanoes that warn before they erupt, with pyroclastic flows, gas and ashfall, and fissure eruptions
  on rifts
- Rivers traced from the land, groundwater and floods, and rain that comes with drifting storms
- Nine gases, a geothermal turbine, and instruments to read it all: hammer, fault compass, core drill,
  seismograph network, weather station

The new terrain needs a new world; earthquakes, volcanoes, weather and instruments also work in older
worlds. Terralith's biomes grow on the mod's terrain, and so do the biomes of Biomes O' Plenty and other
TerraBlender mods. With Tectonic, TerraBlender or Biomes O' Plenty installed, pick FT's Geology under
World Type.

Wiki: https://github.com/Jelada-Studios/fts-geology/wiki
'''

# --- Dependencies ---
[[dependencies.fts_geology]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.0,21.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.fts_geology]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1]"
    ordering = "NONE"
    side = "BOTH"

# Optional integrations — soft deps so we load after them when present.
# TerraFirmaCraft: optional; loaded after it so its blocks can be looked up by id.
[[dependencies.fts_geology]]
    modId = "tfc"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.fts_geology]]
    modId = "flowing_fluids"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.fts_geology]]
    modId = "water_erosion"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

# Immersive Weathering: loaded after it so the mod's data can still its lightning turning rock into magma.
[[dependencies.fts_geology]]
    modId = "immersive_weathering"
    type = "optional"
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"
