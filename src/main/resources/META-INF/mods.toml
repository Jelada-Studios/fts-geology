modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/Jelada-Studios/fts-geology/issues"

[[mods]]
modId = "fts_geology"
version = "${file.jarVersion}"
displayName = "FT's Geology"
authors = "Jelada Studios"
credits = "See CREDITS.md — community reports and questions that shaped the mod."
displayURL = "https://jeladastudios.com/fts-geology/"
description = '''
A geology layer for Minecraft: real plate tectonics driving real landforms.

Most world-generation mods decide what a place looks like. This one decides why. A volcano's shape
is not picked from a list - it comes from the plate boundary it sits on, and so does the rock under
it, the earthquakes that shake it, and the springs around it. The aim is a world you can read.

Four fault types, each producing the landforms it should. Four volcano types, chosen by their
setting. Earthquakes with ten seconds of early warning on a seismograph. Geysers, hot springs and
travertine terraces. Boundary geology underground - dig beneath a volcanic arc and you find granite,
because that is what is there. Instruments to read all of it.

Strongly recommended alongside Terralith and Flowing Fluids.

Reads the world's biome source rather than replacing worldgen, so it stacks on top of Terralith and
Tectonic instead of fighting them. Retrogen-safe: it bolts onto worlds that already exist.

Nothing is destroyed, but ground that loses its support falls - builds included. That, and whether
earthquakes may deform player blocks at all, are config toggles.
'''

# --- Dependencies ---
[[dependencies.fts_geology]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.fts_geology]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

# Optional integrations — soft deps so we load after them when present.
[[dependencies.fts_geology]]
    modId = "flowing_fluids"
    mandatory = false
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.fts_geology]]
    modId = "water_erosion"
    mandatory = false
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"
